<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Analog Clock</title>
<link rel="stylesheet" href="../common/card.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="clockCard" class="card">
    <button id="bgToggle" class="icon-btn clock-toggle" aria-label="Toggle card background" title="Toggle card background">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="12" cy="12" r="4"/></svg>
    </button>
    <div class="card__body clock-body">
      <svg id="clockFace" viewBox="0 0 200 200" class="clock-svg">
        <defs>
          <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f4f4f6"/>
            <stop offset="35%" stop-color="#b9bdc6"/>
            <stop offset="55%" stop-color="#e8e9ec"/>
            <stop offset="100%" stop-color="#8d919b"/>
          </linearGradient>
          <radialGradient id="faceGrad" cx="50%" cy="42%" r="70%">
            <stop offset="0%" stop-color="#fffdf6"/>
            <stop offset="100%" stop-color="#eae5d8"/>
          </radialGradient>
        </defs>

        <!-- bezel -->
        <circle cx="100" cy="100" r="94" fill="url(#bezelGrad)"/>
        <circle cx="100" cy="100" r="94" fill="none" stroke="#6b6f78" stroke-width="1"/>
        <!-- face -->
        <circle cx="100" cy="100" r="84" fill="url(#faceGrad)"/>
        <circle cx="100" cy="100" r="84" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>

        <!-- minute/hour ticks -->
        <g id="ticks" stroke="#333" stroke-linecap="round"></g>

        <!-- numerals -->
        <g id="numerals" font-family="Noto Sans, sans-serif" font-weight="600" fill="#262626" text-anchor="middle" dominant-baseline="middle">
          <text x="100" y="26" font-size="16">12</text>
          <text x="174" y="104" font-size="16">3</text>
          <text x="100" y="182" font-size="16">6</text>
          <text x="26" y="104" font-size="16">9</text>
        </g>

        <!-- hands -->
        <g id="hourHand">
          <rect x="-3.5" y="-46" width="7" height="50" rx="3.5" fill="#1a1a1a"/>
        </g>
        <g id="minuteHand">
          <rect x="-2.5" y="-68" width="5" height="72" rx="2.5" fill="#1a1a1a"/>
        </g>
        <g id="secondHand">
          <rect x="-1" y="-74" width="2" height="82" fill="#c8302a"/>
          <rect x="-1" y="8" width="2" height="14" fill="#c8302a"/>
          <circle cx="0" cy="0" r="4.5" fill="#c8302a"/>
        </g>
        <circle cx="100" cy="100" r="3" fill="#111"/>
      </svg>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

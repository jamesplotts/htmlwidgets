<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Calendar</title>
<link rel="stylesheet" href="../common/card.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="card__body cal-body">
      <div class="cal-header">
        <button id="prevBtn" class="icon-btn" aria-label="Previous month">
          <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div id="monthLabel" class="cal-month">Month Year</div>
        <button id="nextBtn" class="icon-btn" aria-label="Next month">
          <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>

      <div class="cal-weekdays">
        <span class="sun">Sun</span><span>Mon</span><span>Tue</span><span>Wed</span>
        <span>Thu</span><span>Fri</span><span class="sat">Sat</span>
      </div>

      <div id="grid" class="cal-grid"></div>
    </div>

    <div id="noteOverlay" class="note-overlay hidden">
      <div class="note" role="dialog" aria-labelledby="noteDate">
        <div class="note-header">
          <div id="noteDate" class="note-date">Date</div>
          <button id="noteDoneBtn" class="note-done" aria-label="Close note" title="Close (Ctrl+Enter)">Done</button>
        </div>
        <div id="noteView" class="note-text note-view hidden" title="Click to edit"></div>
        <textarea id="noteText" class="note-text" placeholder="Write a note…" spellcheck="true"></textarea>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

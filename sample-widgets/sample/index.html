<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Sample HTML Widget</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="widget">
    <div id="clock">--:--:--</div>
    <div id="date">-</div>

    <div class="gauge-row">
      <div class="gauge">
        <svg viewBox="0 0 36 36">
          <path class="gauge-bg" d="M18 2 a 16 16 0 0 1 0 32 a 16 16 0 0 1 0 -32" />
          <path id="cpuArc" class="gauge-fg" d="M18 2 a 16 16 0 0 1 0 32 a 16 16 0 0 1 0 -32" />
        </svg>
        <div class="gauge-label">CPU</div>
        <div class="gauge-value" id="cpuValue">--%</div>
      </div>

      <div class="gauge">
        <svg viewBox="0 0 36 36">
          <path class="gauge-bg" d="M18 2 a 16 16 0 0 1 0 32 a 16 16 0 0 1 0 -32" />
          <path id="memArc" class="gauge-fg" d="M18 2 a 16 16 0 0 1 0 32 a 16 16 0 0 1 0 -32" />
        </svg>
        <div class="gauge-label">MEM</div>
        <div class="gauge-value" id="memValue">--%</div>
      </div>
    </div>

    <div id="uptime">uptime --</div>

    <!-- Only shown once the bridge confirms run() is enabled in the widget's config -->
    <div id="runBox" class="hidden">
      <input id="runInput" type="text" placeholder="shell command" spellcheck="false">
      <button id="runButton">Run</button>
      <pre id="runOutput"></pre>
    </div>
  </div>

  <!-- Served from the QtWebEngine instance itself; no local copy needed. -->
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="app.js"></script>
</body>
</html>
